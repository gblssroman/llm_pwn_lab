name: llm-convo-observability

include:
  - path: docker-compose.langfuse.yml
    env_file:
      - .env.langfuse

services:
  app-postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm_convo
      POSTGRES_PASSWORD: llm_convo_local
      POSTGRES_DB: llm_convo
      TZ: UTC
      PGTZ: UTC
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_convo -d llm_convo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.langfuse
    environment:
      DATABASE_URL: postgresql+asyncpg://llm_convo:llm_convo_local@app-postgres:5432/llm_convo
      DATABASE_AUTO_CREATE: "true"
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_URL: http://localhost:${LANGFUSE_PORT:-8992}
      LANGFUSE_PROJECT_ID: llm-convo-platform
      MAX_CONCURRENT_CONVERSATIONS: ${MAX_CONCURRENT_CONVERSATIONS:-10}
    ports:
      - 127.0.0.1:${APP_PORT:-8990}:8080
    depends_on:
      app-postgres:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  app_postgres_data:
