name: llm-convo-observability

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: ${LANGFUSE_BASE_URL:-http://localhost:8992}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-postgres}:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_CLUSTER_NAME: default

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  REDIS_TLS_ENABLED: "false"

  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-${LANGFUSE_MINIO_USER:-langfuse}}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-${LANGFUSE_MINIO_PASSWORD}}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://object-storage:8333
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-${LANGFUSE_MINIO_USER:-langfuse}}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-${LANGFUSE_MINIO_PASSWORD}}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://object-storage:8333
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: &langfuse-dependencies
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    environment: *langfuse-environment
    ports:
      - 127.0.0.1:${LANGFUSE_WORKER_PORT:-8993}:3030
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$${HOSTNAME}:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  langfuse-web:
    image: docker.io/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_OBJECT_STORAGE_PORT:-8994}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://object-storage:8333
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - 127.0.0.1:${LANGFUSE_PORT:-8992}:3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$${HOSTNAME}:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: docker.io/postgres:${LANGFUSE_POSTGRES_VERSION:-17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 20

  object-storage:
    image: ${LANGFUSE_OBJECT_STORAGE_IMAGE:-docker.io/chrislusf/seaweedfs:4.48}
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-${LANGFUSE_MINIO_USER:-langfuse}}
      AWS_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-${LANGFUSE_MINIO_PASSWORD}}
      S3_BUCKET: langfuse
    ports:
      - 127.0.0.1:${LANGFUSE_OBJECT_STORAGE_PORT:-8994}:8333
    volumes:
      - langfuse_object_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://localhost:8333/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_object_storage_data:
