[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-convo-platform"
version = "0.1.0"
description = "A durable, observable conversation loop between two OpenAI-compatible LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1,<2",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4.7,<5"]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
llm-convo = "llm_convo.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_convo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench_reference", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
